<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>…</title>
  <link rel="stylesheet" href="../lib/hljs-github.css">
  <link rel="stylesheet" href="print.css">
</head>
<body>
  <div class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <img src="../icons/icon-32.png" alt="" width="22" height="22">
      <label><input type="checkbox" id="optPrompts" checked> <span data-i18n="optPrompts"></span></label>
      <label><input type="checkbox" id="optLabels" checked> <span data-i18n="optLabels"></span></label>
      <label><input type="checkbox" id="optCompact"> <span data-i18n="optCompact"></span></label>
      <label><input type="checkbox" id="optCredit" checked> <span data-i18n="optCredit"></span></label>
      <label><input type="checkbox" id="optDark"> <span data-i18n="optDark"></span></label>
      <label><span data-i18n="optFont"></span>
        <select id="optFont">
          <option value="small" data-i18n="fontSmall"></option>
          <option value="normal" data-i18n="fontNormal" selected></option>
          <option value="large" data-i18n="fontLarge"></option>
        </select>
      </label>
      <button id="printBtn" type="button" data-i18n="printButton"></button>
    </div>
    <p class="hint"><span data-i18n="printHint"></span> <a class="more" id="moreLink" target="_blank" rel="noopener" data-i18n="moreLink"></a></p>
  </div>

  <div class="review-bar" id="reviewBar" role="region" hidden>
    <p><strong data-i18n="reviewTitle"></strong> <span data-i18n="reviewText"></span></p>
    <div class="review-actions">
      <a class="btn primary" id="reviewGo" target="_blank" rel="noopener" data-i18n="reviewButton"></a>
      <button type="button" class="btn" id="reviewLater" data-i18n="reviewLater"></button>
      <button type="button" class="btn link" id="reviewNever" data-i18n="reviewNever" hidden></button>
    </div>
  </div>

  <dialog class="donate" id="donateDialog" aria-labelledby="donateTitle">
    <img src="../icons/icon-128.png" alt="" width="64" height="64">
    <h2 id="donateTitle" data-i18n="donateTitle"></h2>
    <p data-i18n="donateText"></p>
    <div class="donate-actions">
      <a class="btn primary" id="donateGo" target="_blank" rel="noopener" data-i18n="donateButton"></a>
      <button type="button" class="btn" id="donateLater" data-i18n="donateLater"></button>
    </div>
  </dialog>

  <main id="doc">
    <header class="doc-head">
      <h1 id="docTitle" contenteditable="true" spellcheck="false"></h1>
      <p class="meta" id="docMeta"></p>
    </header>
    <div id="messages"></div>
    <footer class="credit" id="credit"><span data-i18n="creditText"></span> <a id="creditLink" target="_blank" rel="noopener"></a> · <a id="creditSite" href="https://gofiodesign.eu" target="_blank" rel="noopener">gofiodesign.eu</a></footer>
  </main>

  <script src="../lib/highlight.min.js"></script>
  <script src="print.js"></script>
</body>
</html>
